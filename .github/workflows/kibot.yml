name: "KiBot PCB Automation"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pcb-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: KiBot Automation Suite
        uses: INTI-CMNB/KiBot@v1.9.1
        with:
          schema: 'project.kicad_sch'
          board: 'project.kicad_pcb'
          config: 'config.kibot.yaml'
          dir: 'generated_outputs'

      - name: Upload Manufacturing Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcb-fabrication-outputs
          path: generated_outputs/
