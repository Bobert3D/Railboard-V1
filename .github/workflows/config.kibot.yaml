kibot:
  version: 1

preflight:
  run_erc: true
  run_drc: true
  check_zone_fills: true

outputs:
  - name: 'Schematic_PDF'
    comment: 'Exports the schematic sheets into a single PDF document'
    type: 'pdf_sch_print'
    dir: 'schematics'

  - name: 'PCB_Gerbers'
    comment: 'Generates standard Gerber files for PCB manufacturing'
    type: 'gerber'
    dir: 'gerbers'
    options:
      layers:
        - 'F.Cu'
        - 'B.Cu'
        - 'F.Paste'
        - 'B.Paste'
        - 'F.SilkS'
        - 'B.SilkS'
        - 'F.Mask'
        - 'B.Mask'
        - 'Edge.Cuts'

  - name: 'PCB_Drills'
    comment: 'Generates Excellon drill files for PCB manufacturing holes'
    type: 'excellon'
    dir: 'gerbers'

  - name: 'Bill_of_Materials'
    comment: 'Generates a standard CSV Bill of Materials'
    type: 'csv'
    dir: 'bom'
    options:
      columns:
        - 'Row'
        - 'References'
        - 'Quantity'
        - 'Value'
        - 'Footprint'
